# /etc/nginx/sites-available/prospecta — TLS terminates here; set ForwardedHeaders__Enabled=true in the app environment.
server {
    listen 80;
    server_name prospecta.example.dz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name prospecta.example.dz;
    ssl_certificate     /etc/letsencrypt/live/prospecta.example.dz/fullchain.pem;   # free certificates: certbot / Let's Encrypt
    ssl_certificate_key /etc/letsencrypt/live/prospecta.example.dz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 6m;            # imports are limited to 5 MB by the application too

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;         # the OpenStreetMap collection can take up to ~45 s
    }
}
